name: CI

# Primary development: push to `dev`. Release path: PR `dev` → `main` runs the same checks (no staging server; validate locally before opening PR).
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

defaults:
  run:
    working-directory: disclo

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Prisma loads datasource URLs for schema validation; `prisma generate` does not open a TCP connection.
      # `schema.prisma` sets `directUrl` for migrations — both vars must exist. Real URLs stay in local `.env` / deploy secrets only.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: disclo/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @disclo/db exec prisma generate
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  # SEC-06: dependency audit — gate on critical; high/moderate tracked via pnpm audit / upgrades
  dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: disclo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: disclo/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level critical
