name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: disclo

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Prisma loads `DATABASE_URL` from env for schema validation; `prisma generate` does not open a TCP connection.
      # Use a syntactically valid placeholder in CI. Real Supabase URLs belong in repo/env secrets for deploy and local `.env` only.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: disclo/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @disclo/db exec prisma generate
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  # SEC-06: dependency audit — gate on critical; high/moderate tracked via pnpm audit / upgrades
  dependency-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: disclo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: disclo/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level critical
